
services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - PYTHONPATH=/app/src
    volumes:
      # Remove o volume de desenvolvimento ou ajuste conforme necessidade
      - ./database.sqlite:/app/src/database.sqlite
    restart: unless-stopped